<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>VRS · Instagram post 1 · The method</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090d;--ink:#f3f5f9;--mut:#8f99ad;--gold:#f5b73b;--gold2:#e0960c;--goldg:linear-gradient(135deg,#ffd77a,#e0960c);--up:#19c37d;--dn:#ef4d56;--line:#1c2230}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222;font-family:Inter,'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:radial-gradient(900px 700px at 85% -10%,rgba(245,183,59,.13),transparent 60%),radial-gradient(800px 600px at -10% 110%,rgba(58,120,255,.07),transparent 60%),var(--bg);color:var(--ink);padding:84px 84px 90px;display:flex;flex-direction:column}
.slide::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.top img{height:44px}
.top .n{font-size:22px;font-weight:700;color:var(--mut);letter-spacing:.08em}
.eye{font-size:24px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-top:70px;position:relative;z-index:2}
h1{font-size:92px;line-height:1.02;font-weight:900;letter-spacing:-.035em;margin-top:22px;position:relative;z-index:2}
h2{font-size:68px;line-height:1.06;font-weight:900;letter-spacing:-.03em;margin-top:18px;position:relative;z-index:2}
h1 span,h2 span{background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{font-size:34px;line-height:1.42;color:#b9c1d1;margin-top:28px;max-width:860px;font-weight:500;position:relative;z-index:2}
p.sub b{color:var(--ink);font-weight:700}
.chart{margin-top:auto;position:relative;z-index:2;border-radius:28px;border:1px solid var(--line);background:rgba(13,17,25,.75);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.chart svg{display:block;width:100%;height:auto}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:40px;position:relative;z-index:2}
.dots{display:flex;gap:10px}.dots i{width:12px;height:12px;border-radius:50%;background:#2a3140}.dots i.on{background:var(--gold);width:34px;border-radius:7px}
.swipe{font-size:26px;font-weight:700;color:var(--mut)}.swipe b{color:var(--gold)}
.small{font-size:20px;color:#5f6879;position:relative;z-index:2}
/* cover */
.cover h1{font-size:104px;margin-top:26px}.cover .eye{margin-top:56px}.cover p.sub{margin-top:22px}.cover .chart svg{max-height:600px}
.cover .chart{margin-top:auto}
/* last slide */
.last .phone{margin:40px auto 0;width:420px;max-height:560px;border:12px solid #1f2633;border-radius:58px;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.9),0 0 0 1px #2c3445;position:relative;z-index:2}
.last .phone img{display:block;width:100%}
.last .cta{margin-top:auto;padding-top:34px;text-align:center;position:relative;z-index:2}
.last .cta b{display:block;font-size:40px;font-weight:800;letter-spacing:-.01em}
.last .cta small{display:block;font-size:24px;color:var(--mut);margin-top:12px}
</style></head>
<body>
<div id="deck"></div>
<script>
/* one buy setup, drawn the same on every slide; each slide reveals one more step */
const K = [ // open, high, low, close (any units)
  [20,24,19,23],[23,27,22,26],[26,29,25,28],[28,33,27,32],[32,36,31,35],[35,38.4,33,37.6],
  [37.6,46,37.2,44],[44,46.5,42,43],[43,45.5,41,45],[45,46.4,42.5,42.8],[42.8,45,41.2,44.6],[44.6,46.2,43,43.5],[43.5,45.8,41.8,45.2], // the range (6..12)
  [45.2,53,44.8,52.2],                                                                                   // the break (13)
  [52.2,57,51.6,56],[56,60,54.8,59],[59,61,56.5,57],                                                     // away from the zone
  [57,57.5,53.5,54],[54,55,51.9,52.9],                                                                   // back into the zone (18 = retest)
  [52.9,58,52.6,57.5],[57.5,63,56.8,62.4],[62.4,66.5,61,65.8],[65.8,70,64.5,69.2],[69.2,72.5,67.8,71.8]];
const RNG = { from: 6, to: 12, hi: 46.5, lo: 41 }, BRK = 13, RET = 18, ENTRY = 52.2, ZLO = 44.8, STOP = 40.2;
const W = 912, H = 660, PADL = 26, PADR = 112, PADT = 36, PADB = 30, lo = 17, hi = 75;
const X = i => PADL + (i + .5) * (W - PADL - PADR) / K.length, Y = v => PADT + (hi - v) / (hi - lo) * (H - PADT - PADB), bw = (W - PADL - PADR) / K.length * .64;
const C = { up: '#19c37d', dn: '#ef4d56', gold: '#f5b73b', mut: '#8f99ad', ink: '#f3f5f9' };

function chart(step) { // step: 0 cover (all), 1 range, 2 break, 3 zone, 4 retest, 5 risk
  const all = step === 0, show = all ? K.length : [0, 13, 14, 17, 19, K.length][step];
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ffd77a"/><stop offset="1" stop-color="#e0960c"/></linearGradient></defs>`;
  for (let y = 20; y <= 70; y += 10) s += `<line x1="${PADL}" x2="${W - PADR + 26}" y1="${Y(y)}" y2="${Y(y)}" stroke="#1a2030" stroke-width="1"/>`;
  const x0 = X(RNG.from) - bw, x1 = X(RNG.to) + bw;
  // 1 range
  if (step >= 1 || all) s += `<rect x="${x0}" y="${Y(RNG.hi)}" width="${x1 - x0}" height="${Y(RNG.lo) - Y(RNG.hi)}" rx="8" fill="rgba(243,245,249,.05)" stroke="${step === 1 ? C.gold : '#5d6677'}" stroke-width="${step === 1 ? 3 : 2}" stroke-dasharray="10 8"/>`
    + `<text x="${(x0 + x1) / 2}" y="${Y(RNG.lo) + 36}" fill="${step === 1 ? C.gold : C.mut}" font-size="22" font-weight="800" letter-spacing="2" text-anchor="middle">RANGE</text>`;
  // 3 zone (behind candles)
  if (step >= 3 || all) { const ze = step >= 4 || all ? X(RET) + bw : W - PADR + 26; s += `<rect x="${X(BRK) - bw}" y="${Y(ENTRY)}" width="${ze - X(BRK) + bw}" height="${Y(ZLO) - Y(ENTRY)}" fill="${C.up}" fill-opacity="${step === 3 ? .22 : .13}" stroke="${C.up}" stroke-opacity=".8" stroke-width="2"/>`
    + (step === 3 ? `<text x="${W - 14}" y="${(Y(ENTRY) + Y(ZLO)) / 2 + 8}" fill="${C.up}" font-size="22" font-weight="800" text-anchor="end" letter-spacing="2">ZONE</text>` : '') }
  // 5 risk: stop, entry, targets
  if (step === 5 || all) {
    const xs = X(RET) - bw, xe = W - PADR + 26, r = ENTRY - STOP;
    s += `<rect x="${xs}" y="${Y(ENTRY)}" width="${xe - xs}" height="${Y(STOP) - Y(ENTRY)}" fill="${C.dn}" fill-opacity=".08"/>`
      + `<line x1="${xs}" x2="${xe}" y1="${Y(STOP)}" y2="${Y(STOP)}" stroke="${C.dn}" stroke-width="2.5" stroke-dasharray="10 7"/><text x="${W - 14}" y="${Y(STOP) + 8}" fill="${C.dn}" font-size="22" font-weight="800" text-anchor="end">STOP</text>`
      + [1, 1.5].map(R => `<line x1="${xs}" x2="${xe}" y1="${Y(ENTRY + r * R)}" y2="${Y(ENTRY + r * R)}" stroke="${C.up}" stroke-width="2" stroke-dasharray="4 6" opacity=".9"/><text x="${W - 14}" y="${Y(ENTRY + r * R) + 8}" fill="${C.up}" font-size="22" font-weight="800" text-anchor="end">+${R}R</text>`).join('');
  }
  // candles
  for (let i = 0; i < show; i++) {
    const [o, h, l, c] = K[i], up = c >= o, col = up ? C.up : C.dn, x = X(i), hot = (step === 2 && i === BRK) || (step === 4 && i === RET);
    const fade = !all && step >= 2 && i < RNG.from ? .55 : 1;
    s += `<g opacity="${fade}"><line x1="${x}" x2="${x}" y1="${Y(h)}" y2="${Y(l)}" stroke="${col}" stroke-width="3"/><rect x="${x - bw / 2}" y="${Y(Math.max(o, c))}" width="${bw}" height="${Math.max(3, Math.abs(Y(o) - Y(c)))}" rx="3" fill="${col}"/></g>`;
    if (hot) s += `<rect x="${x - bw / 2 - 9}" y="${Y(h) - 9}" width="${bw + 18}" height="${Y(l) - Y(h) + 18}" rx="10" fill="none" stroke="url(#g)" stroke-width="4"/>`;
  }
  // 2 break: the close above the range
  if (step === 2) s += `<line x1="${x0}" x2="${X(BRK) + bw + 30}" y1="${Y(RNG.hi)}" y2="${Y(RNG.hi)}" stroke="${C.gold}" stroke-width="3"/>`
    + `<circle cx="${X(BRK)}" cy="${Y(52.2)}" r="9" fill="${C.gold}"/><text x="${X(BRK) + 26}" y="${Y(52.2) + 8}" fill="${C.gold}" font-size="24" font-weight="800">body close</text>`;
  if ((step >= 2 && step !== 2) || all) s += `<line x1="${x0}" x2="${X(BRK) + bw}" y1="${Y(RNG.hi)}" y2="${Y(RNG.hi)}" stroke="${C.up}" stroke-width="2.5"/><text x="${(x0 + X(BRK)) / 2}" y="${Y(RNG.hi) - 14}" fill="${C.up}" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="1">BREAK ↑</text>`;
  // 4 retest: the entry
  if (step >= 4 || all) s += `<circle cx="${X(RET)}" cy="${Y(ENTRY)}" r="10" fill="${C.up}" stroke="#fff" stroke-width="3"/><g transform="translate(${X(RET)},${Y(K[RET][2]) + 52})"><rect x="-62" y="-26" width="124" height="38" rx="9" fill="${C.up}"/><text x="0" y="1" fill="#fff" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="1">ENTRY</text></g>`;
  return s + '</svg>';
}

const total = 7, logo = '../brand/vrs-lockup-transparent-light-text.png';
const dots = k => `<div class="dots">${Array.from({ length: total }, (_, i) => `<i class="${i === k ? 'on' : ''}"></i>`).join('')}</div>`;
const hdr = k => `<div class="top"><img src="${logo}" alt="VRS"><span class="n">${k + 1} / ${total}</span></div>`;
const foot = (k, t = 'Swipe <b>→</b>') => `<div class="foot">${dots(k)}<span class="swipe">${t}</span></div>`;
const step = (k, n, eye, title, sub) => `<section class="slide">${hdr(k)}<div class="eye">${eye}</div><h2>${title}</h2><p class="sub">${sub}</p><div class="chart">${chart(n)}</div>${foot(k)}</section>`;

document.getElementById('deck').innerHTML = [
  `<section class="slide cover">${hdr(0)}<div class="eye">The method · in 5 steps</div><h1>Price rests.<br><span>Then it moves.</span></h1><p class="sub">One rule-based setup we use on every chart. Save this one for your next session.</p><div class="chart">${chart(0)}</div>${foot(0)}</section>`,
  step(1, 1, '01 · The range', 'Price goes sideways<br>in a <span>tight box.</span>', 'Buyers and sellers agree on the price. Nobody is in control yet. <b>We just wait.</b>'),
  step(2, 2, '02 · The break', 'A candle <span>closes</span><br>outside the box.', 'The body, not just a wick. That close is the first sign <b>one side took control.</b>'),
  step(3, 3, '03 · The zone', 'Mark the<br><span>breaking candle.</span>', 'From its close to its wick. Price often comes back to this area <b>before it moves on.</b>'),
  step(4, 4, '04 · The retest', 'Price comes back.<br><span>That is the entry.</span>', 'No chasing the breakout. We wait for price to return to the zone, <b>then we act.</b>'),
  step(5, 5, '05 · The risk', 'Decide the loss first.<br><span>Then the size.</span>', 'The stop goes beyond the range, where the idea is wrong. Your risk % sets the size: <b>1%&nbsp;stays&nbsp;1%.</b>'),
  `<section class="slide last">${hdr(6)}<div class="eye">That is all of it</div><h2>No guessing.<br><span>Just rules.</span></h2><p class="sub">We built our tools around these five steps. They mark the range, the zone and what the setup is still waiting for.</p>
    <div class="phone"><img src="../lp-phone.jpg" alt="The VRS terminal on a phone"></div>
    <div class="cta"><b>Follow for one real chart breakdown a week.</b><small>Educational content · not financial advice · trading carries risk</small></div>${foot(6, '')}</section>`,
].join('');
</script>
</body></html>
