<style>

.blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.55;z-index:-3}

<body>
<div id="deck"></div>
<script>
const TOTAL = 3, LOGO = '../brand/vrs-lockup-transparent-light-text.png', STORY = true;
const bg = (big = '') => `<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="rays"></div><div class="floor"></div>${big}<div class="grain"></div><div class="vig"></div>`;
const hdr = k => `<div class="top"><img src="${LOGO}" alt="VRS">${STORY ? '' : `<span class="n">${String(k + 1).padStart(2, '0')} / ${String(TOTAL).padStart(2, '0')}</span>`}</div>`;
const foot = k => STORY ? '' : `<div class="foot"><div class="bar"><i style="width:${(k + 1) / TOTAL * 100}%"></i></div>${k < TOTAL - 1 ? '<div class="swipe">Swipe <b>→</b></div>' : ''}</div>`;
const curve = (pts, col) => { const W = 900, H = 150, xs = pts.map((v, i) => [i / (pts.length - 1) * W, H - 10 - (v - Math.min(...pts)) / (Math.max(...pts) - Math.min(...pts) || 1) * (H - 20)]); return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="M${xs.map(p => p.join(' ')).join(' L')}" fill="none" stroke="${col}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/></svg>` };
const S = [];
const CANDLES = (H = 430) => {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const N = 56, W = 912, PL = 20, PR = 20, PT = 70, PB = 54, K = []; let p = 2650;
  for (let i = 0; i < N; i++) { const drift = i < 14 ? -.6 : i < 20 ? .2 : 1.15, o = p, c = o + drift + (rnd() - .5) * 9, h = Math.max(o, c) + rnd() * 4, l = Math.min(o, c) - rnd() * 4; K.push({ o, c, h, l }); p = c }
  const lo = Math.min(...K.map(k => k.l)) - 4, hi = Math.max(...K.map(k => k.h)) + 6, cw = (W - PL - PR) / N;

  return `<div class="tchart"><div class="tc-hd"><span><b>XAUUSD</b> · M30 · paper</span><span class="bal">$10,000 → <b>$10,642</b></span></div>
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}</svg>
    <div class="tc-res">+6.4%<small>this week</small></div></div>`;
};
